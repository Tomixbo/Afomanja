{% extends "base.html" %}
{% block content %}
<div class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h1 class="text-2xl font-bold text-center mb-6">Se connecter</h1>
        
        <!-- Formulaire de connexion -->
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <!-- Champ Email -->
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
            </div>

            <!-- Champ Mot de passe -->
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
                <input type="password" id="password" name="password" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
            </div>

            <!-- Bouton de connexion -->
            <button type="submit" class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500">
                Se connecter
            </button>
        </form>

        <!-- Lien vers la page d'inscription -->
        <p class="mt-4 text-center text-sm text-gray-600">
            Pas encore de compte ? <a href="{% url 'register' %}" class="text-green-600 hover:underline">S'inscrire</a>
        </p>
    </div>
</div>
    {% endblock %}
